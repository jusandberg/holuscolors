<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hōlus Style 8 Icon Library</title>
  <style>
    :root{--ink:#293833;--muted:#64716c;--sage:#71836d;--sage-pale:#eaf0e8;--plum:#9c8aa2;--terracotta:#b4877b;--mustard:#c7b07a;--slate:#8aa3b0;--line:#dfe6dc;--paper:#fff;--cloud:#f6f8f5;--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--cloud);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}.shell{width:min(100% - 28px,1180px);margin:auto}.top{padding:42px 0 25px;background:var(--paper);border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 8px;color:#78647e;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.title-row{display:flex;align-items:end;justify-content:space-between;gap:20px}
    h1{margin:0;font-size:clamp(32px,6vw,58px);line-height:.98;letter-spacing:-.055em}.summary{max-width:600px;margin:15px 0 0;color:var(--muted);font-size:16px}.total{flex:none;padding:9px 14px;border-radius:999px;background:var(--sage-pale);font-weight:800}
    .controls{position:sticky;top:0;z-index:10;padding:14px 0;background:rgba(246,248,245,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.control-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .search{flex:1 1 250px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;color:var(--ink);background:#fff;outline:none}.search:focus{border-color:var(--plum);box-shadow:0 0 0 3px rgba(156,138,162,.18)}
    .filters{display:flex;gap:7px;overflow:auto;padding:2px 0 4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:none;padding:9px 13px;border:1px solid var(--line);border-radius:999px;color:var(--ink);background:#fff;font-weight:750;cursor:pointer}.filter[aria-pressed="true"]{color:#fff;background:#5d7067;border-color:#5d7067}
    main{padding:26px 0 50px}.results-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}.results-head strong{font-size:14px}.page-note{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{position:relative;min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:0 7px 22px rgba(41,56,51,.05);transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(41,56,51,.1)}
    .preview{display:grid;place-items:center;width:100%;aspect-ratio:1;margin:0 0 12px;padding:13px;border:0;border-radius:16px;background:linear-gradient(145deg,#fff,var(--sage-pale));cursor:zoom-in}.preview img{display:block;width:100%;height:100%;object-fit:contain}.label{margin:0;font-size:14px;font-weight:850;line-height:1.2}.filename{display:block;margin-top:4px;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.badge{display:inline-flex;margin-top:8px;padding:3px 7px;border-radius:999px;background:#f0edf2;color:#6f5c75;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
    .pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;flex-wrap:wrap}.page-btn{min-width:42px;height:42px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer}.page-btn[aria-current="page"]{color:#fff;background:#5d7067;border-color:#5d7067}.page-btn:disabled{opacity:.35;cursor:not-allowed}.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted)}
    dialog{width:min(92vw,640px);padding:0;border:0;border-radius:28px;background:#fff;box-shadow:0 35px 90px rgba(25,35,31,.28)}dialog::backdrop{background:rgba(31,42,38,.68);backdrop-filter:blur(4px)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:20px}.close{width:40px;height:40px;border:0;border-radius:50%;background:var(--sage-pale);font-size:22px;cursor:pointer}.modal-art{display:grid;place-items:center;min-height:360px;padding:32px;background:linear-gradient(145deg,#fff,#eef3ec)}.modal-art img{width:min(100%,430px);max-height:430px}.modal-meta{padding:16px 20px 22px;color:var(--muted);font-size:13px}.modal-meta code{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    @media(max-width:620px){.top{padding-top:30px}.title-row{align-items:start}.total{font-size:12px}.summary{font-size:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:10px;border-radius:18px}.preview{padding:9px;border-radius:13px}.label{font-size:12px}.filename{font-size:9px}.modal-art{min-height:280px;padding:22px}}
  </style>
</head>

    const CATEGORIES=["Decorations","Drinks","Food","Fruit","Herbs","Objects","Other","Vegetables"];
    const COUNTS={"Decorations":16,"Drinks":10,"Food":36,"Fruit":24,"Herbs":4,"Objects":110,"Other":1,"Vegetables":21};
    const PER_PAGE=24;
    let active='All', query='', page=1;
    const grid=document.getElementById('grid'),filters=document.getElementById('filters'),pagination=document.getElementById('pagination'),resultCount=document.getElementById('result-count'),pageNote=document.getElementById('page-note');
    const dialog=document.getElementById('icon-dialog'),modalImage=document.getElementById('modal-image'),modalTitle=document.getElementById('modal-title'),modalFile=document.getElementById('modal-file'),modalCategory=document.getElementById('modal-category');
    function filtered(){const q=query.trim().toLowerCase();return ICONS.filter(icon=>(active==='All'||icon.category===active)&&(!q||[icon.label,icon.filename,icon.category].some(value=>value.toLowerCase().includes(q))))}
    function renderFilters(){filters.innerHTML=['All',...CATEGORIES].map(category=>'<button class="filter" aria-pressed="'+(category===active)+'" data-category="'+category+'">'+category+' <span>'+ (category==='All'?ICONS.length:COUNTS[category]) +'</span></button>').join('');filters.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{active=button.dataset.category;page=1;render()}))}
    function openIcon(icon){modalTitle.textContent=icon.label;modalImage.src=icon.src;modalImage.alt=icon.label;modalFile.textContent=icon.path;modalCategory.textContent=icon.category;dialog.showModal()}
    function render(shouldScroll=true){renderFilters();const list=filtered(),pages=Math.max(1,Math.ceil(list.length/PER_PAGE));page=Math.min(page,pages);const start=(page-1)*PER_PAGE,shown=list.slice(start,start+PER_PAGE);resultCount.textContent=list.length+' icon'+(list.length===1?'':'s');pageNote.textContent=list.length?'Page '+page+' of '+pages:'';grid.innerHTML=shown.length?shown.map((icon,index)=>'<article class="card"><button class="preview" data-index="'+index+'" aria-label="Enlarge '+icon.label+'"><img src="'+icon.src+'" alt=""></button><h2 class="label">'+icon.label+'</h2><span class="filename" title="'+icon.filename+'">'+icon.filename+'</span><span class="badge">'+icon.category+'</span></article>').join(''):'<p class="empty">No icons match that search.</p>';grid.querySelectorAll('.preview').forEach(button=>button.addEventListener('click',()=>openIcon(shown[Number(button.dataset.index)])));renderPages(pages);if(shouldScroll)window.scrollTo({top:document.querySelector('.controls').offsetTop,behavior:'smooth'})}
    function renderPages(pages){if(pages<=1){pagination.innerHTML='';return}const items=[];items.push('<button class="page-btn" data-page="prev" '+(page===1?'disabled':'')+'>Previous</button>');for(let value=1;value<=pages;value++)items.push('<button class="page-btn" data-page="'+value+'" '+(value===page?'aria-current="page"':'')+'>'+value+'</button>');items.push('<button class="page-btn" data-page="next" '+(page===pages?'disabled':'')+'>Next</button>');pagination.innerHTML=items.join('');pagination.querySelectorAll('button:not(:disabled)').forEach(button=>button.addEventListener('click',()=>{page=button.dataset.page==='prev'?page-1:button.dataset.page==='next'?page+1:Number(button.dataset.page);render()}))}
    document.getElementById('search').addEventListener('input',event=>{query=event.target.value;page=1;render()});document.getElementById('modal-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});render(false);
  </script>
